<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #82A868; } a:hover { color: #6b8c55; }
  </style>
</helmet>
<div style="position:relative;width:760px;height:430px;overflow:hidden;background:#ECEFE6;font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <div style="position:absolute;left:-80px;top:-100px;width:380px;height:380px;border-radius:50%;background:#B5CFA2;opacity:0.50;filter:blur(80px)"></div>

  <div style="position:absolute;left:60px;top:52px;width:640px;border-radius:16px;background:rgba(251,251,246,0.94);backdrop-filter:blur(24px) saturate(1.1);border:1px solid rgba(50,60,60,0.08);box-shadow:0 14px 36px rgba(70,80,80,0.16)">

    <div style="display:flex;align-items:center;gap:12px;height:58px;padding:0 20px">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#8A9694" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"></circle><path d="M13.5 13.5 L17 17"></path></svg>
      <div style="flex-grow:1;font-size:16px;color:#ABB1AB">搜索模块，数字键直达…</div>
      <div style="font-size:11px;color:#ABB1AB">Esc</div>
    </div>

    <div style="height:1px;background:rgba(50,60,60,0.07);margin:0 16px"></div>

    <div style="display:flex;flex-direction:column;gap:2px;padding:8px 10px 12px">

      <div style="display:flex;align-items:center;gap:14px;height:44px;padding:0 12px;border-radius:8px;background:{{accentWash}}">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="{{accent}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.8" y="2.8" width="6.2" height="6.2" rx="1.6"></rect><rect x="11" y="2.8" width="6.2" height="6.2" rx="1.6"></rect><rect x="2.8" y="11" width="6.2" height="6.2" rx="1.6"></rect><rect x="11" y="11" width="6.2" height="6.2" rx="1.6"></rect></svg>
        <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px"><span style="font-size:14px;color:#363B3A">示例工具</span><span style="width:5px;height:5px;border-radius:50%;background:{{accent}}"></span></div>
          <div style="font-size:11px;color:#9AA19C">验证岛内交互管线</div>
        </div>
        <div style="font-size:11px;color:{{accent}}">1</div>
      </div>

      <div style="display:flex;align-items:center;gap:14px;height:44px;padding:0 12px;border-radius:8px;background:transparent">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="#8A8F8A" stroke-width="1.5" stroke-linecap="round"><path d="M9 5.5 V3.2"></path><path d="M5.5 9 H3.2"></path><path d="M6 6 L4.4 4.4"></path><path d="M9 9 v9 l2.6 -2.4 1.7 3.1 1.9 -1 -1.7 -3.1 3.3 -0.6 z" fill="#8A8F8A" stroke="none"></path></svg>
        <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0">
          <div style="font-size:14px;color:#363B3A">连点器</div>
          <div style="font-size:11px;color:#9AA19C">自动连点 · 即将到来</div>
        </div>
        <div style="font-size:11px;color:#A8ABA6">2</div>
      </div>

      <div style="display:flex;align-items:center;gap:14px;height:44px;padding:0 12px;border-radius:8px;background:transparent">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="#8A8F8A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="12" height="9.5" rx="2.4"></rect><path d="M6.5 12.5 v3 l3 -3"></path><text x="8.5" y="10.3" font-size="7.5" text-anchor="middle" fill="#8A8F8A" stroke="none" style="font-family:'Microsoft YaHei',sans-serif">文</text></svg>
        <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0">
          <div style="font-size:14px;color:#363B3A">翻译</div>
          <div style="font-size:11px;color:#9AA19C">输入即翻 · 即将到来</div>
        </div>
        <div style="font-size:11px;color:#A8ABA6">3</div>
      </div>

      <div style="display:flex;align-items:center;gap:14px;height:44px;padding:0 12px;border-radius:8px;background:transparent">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="#8A8F8A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4" width="11" height="13.5" rx="2"></rect><rect x="7.7" y="2.5" width="4.6" height="3" rx="1.2"></rect><path d="M7.5 9.5 h5"></path><path d="M7.5 12.5 h3.5"></path></svg>
        <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0">
          <div style="font-size:14px;color:#363B3A">剪贴板</div>
          <div style="font-size:11px;color:#9AA19C">历史记录 · 构想中</div>
        </div>
        <div style="font-size:11px;color:#A8ABA6">4</div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#82A868","options":["#82A868","#6FA98C","#9DBE8D","#5E8D5A"]},"$preview":{"width":760,"height":430}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#82A868';
    return { accent, accentWash: accent + '14' };
  }
}
</script>
</body>
</html>
